name: Publish leaderboard

# Rebuilds the public leaderboard whenever something it shows changes: a new
# result in game_history.json, a picture, a deck sound, or the site itself.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "game_history.json"
      - "Backgrounds/**"
      - "sound/Commander/**"
      - "build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

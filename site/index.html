<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110d">
  <link rel="preload" as="image" href="grimoire-leather.webp" fetchpriority="high">
  <link rel="preload" as="image" href="grimoire-paper.webp" fetchpriority="high">
  <title>MTG Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cinzel+Decorative:wght@700&family=Cormorant+SC:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Megrim&family=Marcellus&family=Metamorphous&family=Uncial+Antiqua&family=UnifrakturMaguntia&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css">
  <link rel="stylesheet" href="site.css">
  <script>
    /* Start fresh on reload and on a page restored from the back/forward cache. */
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    const resetPageScroll = () => window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    resetPageScroll();
    window.addEventListener("pageshow", resetPageScroll);
    /* The grimoire is skipped for reduced motion, and on a later load in the
       same tab when the intro is set to play once per visit (playGrimoire()
       in site.js keeps that note). Decided here so it never flashes. */
    try {
      if (sessionStorage.getItem("grimoire-opened") || matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("no-grimoire");
    } catch (error) { /* storage blocked: it simply plays */ }
  </script>
</head>
<body>
  <!-- The opening: covers the page from the first paint; site.js builds the book inside. -->
  <div class="grimoire"></div>
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="sigil" aria-hidden="true">
    <span class="sigil-core"></span>
    <svg viewBox="0 0 200 200">
      <defs>
        <!-- Each line and ring glows in its own colours: a blurred copy under the sharp one. -->
        <filter id="sigil-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <linearGradient id="sigil-link-wu" gradientUnits="userSpaceOnUse" x1="100" y1="40" x2="157.1" y2="81.5"><stop offset="0" style="stop-color:var(--sigil-w)"/><stop offset="1" style="stop-color:var(--sigil-u)"/></linearGradient>
        <linearGradient id="sigil-link-ub" gradientUnits="userSpaceOnUse" x1="157.1" y1="81.5" x2="135.3" y2="148.5"><stop offset="0" style="stop-color:var(--sigil-u)"/><stop offset="1" style="stop-color:var(--sigil-b)"/></linearGradient>
        <linearGradient id="sigil-link-br" gradientUnits="userSpaceOnUse" x1="135.3" y1="148.5" x2="64.7" y2="148.5"><stop offset="0" style="stop-color:var(--sigil-b)"/><stop offset="1" style="stop-color:var(--sigil-r)"/></linearGradient>
        <linearGradient id="sigil-link-rg" gradientUnits="userSpaceOnUse" x1="64.7" y1="148.5" x2="42.9" y2="81.5"><stop offset="0" style="stop-color:var(--sigil-r)"/><stop offset="1" style="stop-color:var(--sigil-g)"/></linearGradient>
        <linearGradient id="sigil-link-gw" gradientUnits="userSpaceOnUse" x1="42.9" y1="81.5" x2="100" y2="40"><stop offset="0" style="stop-color:var(--sigil-g)"/><stop offset="1" style="stop-color:var(--sigil-w)"/></linearGradient>
        <linearGradient id="sigil-link-wb" gradientUnits="userSpaceOnUse" x1="100" y1="40" x2="135.3" y2="148.5"><stop offset="0" style="stop-color:var(--sigil-w)"/><stop offset="1" style="stop-color:var(--sigil-b)"/></linearGradient>
        <linearGradient id="sigil-link-ur" gradientUnits="userSpaceOnUse" x1="157.1" y1="81.5" x2="64.7" y2="148.5"><stop offset="0" style="stop-color:var(--sigil-u)"/><stop offset="1" style="stop-color:var(--sigil-r)"/></linearGradient>
        <linearGradient id="sigil-link-bg" gradientUnits="userSpaceOnUse" x1="135.3" y1="148.5" x2="42.9" y2="81.5"><stop offset="0" style="stop-color:var(--sigil-b)"/><stop offset="1" style="stop-color:var(--sigil-g)"/></linearGradient>
        <linearGradient id="sigil-link-rw" gradientUnits="userSpaceOnUse" x1="64.7" y1="148.5" x2="100" y2="40"><stop offset="0" style="stop-color:var(--sigil-r)"/><stop offset="1" style="stop-color:var(--sigil-w)"/></linearGradient>
        <linearGradient id="sigil-link-gu" gradientUnits="userSpaceOnUse" x1="42.9" y1="81.5" x2="157.1" y2="81.5"><stop offset="0" style="stop-color:var(--sigil-g)"/><stop offset="1" style="stop-color:var(--sigil-u)"/></linearGradient>
      </defs>
      <g class="sigil-frame"><g class="sigil-ticks"><circle cx="100" cy="100" r="94"/><circle class="sigil-dashes" cx="100" cy="100" r="89"/></g><circle cx="100" cy="100" r="84"/></g>
      <!-- Pentagon edges join allied colours, the star's join enemies; each runs from one colour into the other. -->
      <g class="sigil-links" filter="url(#sigil-glow)">
        <line class="sigil-link sigil-link--ally" data-a="w" data-b="u" style="--order:0" x1="100" y1="40" x2="157.1" y2="81.5" stroke="url(#sigil-link-wu)"/>
        <line class="sigil-link sigil-link--ally" data-a="u" data-b="b" style="--order:1" x1="157.1" y1="81.5" x2="135.3" y2="148.5" stroke="url(#sigil-link-ub)"/>
        <line class="sigil-link sigil-link--ally" data-a="b" data-b="r" style="--order:2" x1="135.3" y1="148.5" x2="64.7" y2="148.5" stroke="url(#sigil-link-br)"/>
        <line class="sigil-link sigil-link--ally" data-a="r" data-b="g" style="--order:3" x1="64.7" y1="148.5" x2="42.9" y2="81.5" stroke="url(#sigil-link-rg)"/>
        <line class="sigil-link sigil-link--ally" data-a="g" data-b="w" style="--order:4" x1="42.9" y1="81.5" x2="100" y2="40" stroke="url(#sigil-link-gw)"/>
        <line class="sigil-link sigil-link--enemy" data-a="w" data-b="b" style="--order:0" x1="100" y1="40" x2="135.3" y2="148.5" stroke="url(#sigil-link-wb)"/>
        <line class="sigil-link sigil-link--enemy" data-a="u" data-b="r" style="--order:1" x1="157.1" y1="81.5" x2="64.7" y2="148.5" stroke="url(#sigil-link-ur)"/>
        <line class="sigil-link sigil-link--enemy" data-a="b" data-b="g" style="--order:2" x1="135.3" y1="148.5" x2="42.9" y2="81.5" stroke="url(#sigil-link-bg)"/>
        <line class="sigil-link sigil-link--enemy" data-a="r" data-b="w" style="--order:3" x1="64.7" y1="148.5" x2="100" y2="40" stroke="url(#sigil-link-rw)"/>
        <line class="sigil-link sigil-link--enemy" data-a="g" data-b="u" style="--order:4" x1="42.9" y1="81.5" x2="157.1" y2="81.5" stroke="url(#sigil-link-gu)"/>
      </g>
      <g class="sigil-nodes" filter="url(#sigil-glow)">
        <g class="sigil-node" data-color="w" style="--node:var(--sigil-w);--order:0"><circle cx="100" cy="40" r="20"/><circle class="sigil-node-inner" cx="100" cy="40" r="15.5"/></g>
        <g class="sigil-node" data-color="u" style="--node:var(--sigil-u);--order:1"><circle cx="157.1" cy="81.5" r="20"/><circle class="sigil-node-inner" cx="157.1" cy="81.5" r="15.5"/></g>
        <g class="sigil-node" data-color="b" style="--node:var(--sigil-b);--order:2"><circle cx="135.3" cy="148.5" r="20"/><circle class="sigil-node-inner" cx="135.3" cy="148.5" r="15.5"/></g>
        <g class="sigil-node" data-color="r" style="--node:var(--sigil-r);--order:3"><circle cx="64.7" cy="148.5" r="20"/><circle class="sigil-node-inner" cx="64.7" cy="148.5" r="15.5"/></g>
        <g class="sigil-node" data-color="g" style="--node:var(--sigil-g);--order:4"><circle cx="42.9" cy="81.5" r="20"/><circle class="sigil-node-inner" cx="42.9" cy="81.5" r="15.5"/></g>
      </g>
    </svg>
    <i class="ms ms-w sigil-symbol" data-color="w" style="left:50%;top:20%;--mana:var(--sigil-w);--order:0"></i>
    <i class="ms ms-u sigil-symbol" data-color="u" style="left:78.55%;top:40.75%;--mana:var(--sigil-u);--order:1"></i>
    <i class="ms ms-b sigil-symbol" data-color="b" style="left:67.65%;top:74.25%;--mana:var(--sigil-b);--order:2"></i>
    <i class="ms ms-r sigil-symbol" data-color="r" style="left:32.35%;top:74.25%;--mana:var(--sigil-r);--order:3"></i>
    <i class="ms ms-g sigil-symbol" data-color="g" style="left:21.45%;top:40.75%;--mana:var(--sigil-g);--order:4"></i>
  </div>
  <canvas id="embers" aria-hidden="true"></canvas>
  <main id="app"><div class="empty">Loading the leaderboard…</div></main>
  <script src="site.js"></script>
</body>
</html>

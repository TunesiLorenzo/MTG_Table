<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110d">
  <title>MTG Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cinzel+Decorative:wght@700&family=Cormorant+SC:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Megrim&family=Marcellus&family=Metamorphous&family=Uncial+Antiqua&family=UnifrakturMaguntia&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css">
  <link rel="stylesheet" href="site.css">
  <script>
    /* The grimoire opens once per visit, and never for reduced motion; see
       playGrimoire() in site.js. Decided here so it never flashes. */
    try {
      if (sessionStorage.getItem("grimoire-opened") || matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("no-grimoire");
    } catch (error) { /* storage blocked: it simply plays */ }
  </script>
</head>
<body>
  <div class="grimoire" aria-hidden="true">
    <svg class="grimoire-defs" width="0" height="0"><filter id="ink-rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></svg>
    <div class="grimoire-float">
      <div class="grimoire-stage">
        <div class="grimoire-pages"><svg class="grimoire-ink" data-ink="right" viewBox="0 0 240 330"></svg><span class="grimoire-glow"></span></div>
        <div class="grimoire-leaf" style="--order:0"><div class="leaf-face"><svg class="grimoire-ink" data-ink="faded" viewBox="0 0 240 330"></svg></div><div class="leaf-face leaf-back"><svg class="grimoire-ink" data-ink="faded" viewBox="0 0 240 330"></svg></div></div>
        <div class="grimoire-leaf" style="--order:1"><div class="leaf-face"><svg class="grimoire-ink" data-ink="faded" viewBox="0 0 240 330"></svg></div><div class="leaf-face leaf-back"><svg class="grimoire-ink" data-ink="left" viewBox="0 0 240 330"></svg></div></div>
        <div class="grimoire-cover">
          <div class="grimoire-cover-front"><span class="grimoire-corner" data-corner="tl"></span><span class="grimoire-corner" data-corner="tr"></span><span class="grimoire-corner" data-corner="bl"></span><span class="grimoire-corner" data-corner="br"></span><svg class="grimoire-emblem" viewBox="0 0 200 200"><defs><path id="emblem-ring" d="M100 100m-76 0a76 76 0 1 1 152 0a76 76 0 1 1-152 0"/></defs><g class="emblem-base"><circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="62"/><path d="M100 40 135.3 148.5 42.9 81.5 157.1 81.5 64.7 148.5Z"/><circle cx="100" cy="40" r="9"/><circle cx="157.1" cy="81.5" r="9"/><circle cx="135.3" cy="148.5" r="9"/><circle cx="64.7" cy="148.5" r="9"/><circle cx="42.9" cy="81.5" r="9"/><circle cx="100" cy="100" r="14"/><text><textPath href="#emblem-ring" textLength="470">ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚠᚢᚦᚨᚱᚲ</textPath></text></g><g class="emblem-fire"><circle cx="100" cy="100" r="92" pathLength="1"/><circle cx="100" cy="100" r="62" pathLength="1"/><path d="M100 40 135.3 148.5 42.9 81.5 157.1 81.5 64.7 148.5Z" pathLength="1"/><circle cx="100" cy="40" r="9" pathLength="1"/><circle cx="157.1" cy="81.5" r="9" pathLength="1"/><circle cx="135.3" cy="148.5" r="9" pathLength="1"/><circle cx="64.7" cy="148.5" r="9" pathLength="1"/><circle cx="42.9" cy="81.5" r="9" pathLength="1"/><circle cx="100" cy="100" r="14" pathLength="1"/></g></svg><span class="grimoire-title">Commander Night</span><span class="grimoire-clasp"></span></div>
          <div class="grimoire-cover-back"></div>
        </div>
      </div>
    </div>
    <span class="grimoire-bloom"></span>
    <div class="grimoire-rising"><i class="ms ms-w ms-cost ms-shadow" style="--order:0"></i><i class="ms ms-u ms-cost ms-shadow" style="--order:1"></i><i class="ms ms-b ms-cost ms-shadow" style="--order:2"></i><i class="ms ms-r ms-cost ms-shadow" style="--order:3"></i><i class="ms ms-g ms-cost ms-shadow" style="--order:4"></i></div>
    <span class="grimoire-skip">Click to skip</span>
  </div>
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="sigil" aria-hidden="true">
    <svg viewBox="0 0 200 200">
      <g class="sigil-ticks"><circle cx="100" cy="100" r="94"/><circle class="sigil-dashes" cx="100" cy="100" r="89"/></g>
      <circle cx="100" cy="100" r="84"/>
      <path class="sigil-pentagon" d="M100 40 157.1 81.5 135.3 148.5 64.7 148.5 42.9 81.5Z"/>
      <path class="sigil-star" d="M100 40 135.3 148.5 42.9 81.5 157.1 81.5 64.7 148.5Z"/>
      <circle class="sigil-node" cx="100" cy="40" r="20"/><circle class="sigil-node" cx="157.1" cy="81.5" r="20"/><circle class="sigil-node" cx="135.3" cy="148.5" r="20"/><circle class="sigil-node" cx="64.7" cy="148.5" r="20"/><circle class="sigil-node" cx="42.9" cy="81.5" r="20"/>
    </svg>
    <i class="ms ms-w sigil-symbol" data-color="w" style="left:50%;top:20%;--mana:var(--mana-w);--order:0"></i>
    <i class="ms ms-u sigil-symbol" data-color="u" style="left:78.55%;top:40.75%;--mana:var(--mana-u);--order:1"></i>
    <i class="ms ms-b sigil-symbol" data-color="b" style="left:67.65%;top:74.25%;--mana:var(--mana-b);--order:2"></i>
    <i class="ms ms-r sigil-symbol" data-color="r" style="left:32.35%;top:74.25%;--mana:var(--mana-r);--order:3"></i>
    <i class="ms ms-g sigil-symbol" data-color="g" style="left:21.45%;top:40.75%;--mana:var(--mana-g);--order:4"></i>
  </div>
  <canvas id="embers" aria-hidden="true"></canvas>
  <main id="app"><div class="empty">Loading the leaderboard…</div></main>
  <script src="site.js"></script>
</body>
</html>
